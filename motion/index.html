<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Motion Test — Tyler Dunham</title>
    <link rel="stylesheet" href="../css/style.css">
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="../index.html">
        TYLER DUNHAM<span> / PHOTO</span>

      <nav class="site-nav" style="display:flex">
        <a href="../index.html#work">Work</a>
        <a href="../index.html#about">About</a>
        <a href="../index.html#contact">Contact</a>

    <main class="section-shell">
      <div class="gallery-frame">
        <div class="gallery-header">
          <p class="eyebrow">Test gallery · 10 images</p>
          <h1 class="gallery-title">Motion</h1>
          <p class="gallery-lede">A generated gallery with click-to-enlarge images.</p>
        </div>

    <footer class="site-footer section-shell">

    <div class="lightbox" hidden>
      <button class="lightbox-close" type="button" aria-label="Close image">×</button>
      <button class="lightbox-prev" type="button" aria-label="Previous image">←</button>
      <img class="lightbox-image" alt="">
      <button class="lightbox-next" type="button" aria-label="Next image">→</button>
      <p class="lightbox-count"></p>
    </div>
